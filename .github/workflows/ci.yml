name: CI

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.8", "3.10", "3.12"]

    steps:
    - uses: actions/checkout@v4
    - name: Set up Python ${{ matrix.python-version }}
      uses: actions/setup-python@v5
      with:
        python-version: ${{ matrix.python-version }}
    - name: Install dependencies
      run: |
        python -m pip install --upgrade pip
        pip install .[dev]
    - name: Check formatting with ruff
      run: ruff format --check .
    - name: Lint with ruff
      run: ruff check .
    - name: Static type checking with mypy
      run: mypy .
    - name: Run Python unit tests
      run: python tests/test_core.py -v
    - name: Run ops module tests
      run: python -X utf8 tests/test_ops.py -v
    - name: Run parser regression tests
      run: python tests/test_parser.py
    - name: Run LSP tests
      run: python -X utf8 tests/test_lsp.py -v
    - name: Run package manager tests
      run: python -X utf8 tests/test_package.py -v
    - name: Run IoT tests
      run: python -X utf8 tests/test_iot.py -v
    - name: Run sugar.san tests
      run: python -X utf8 tests/test_sugar_san.py -v
    - name: Run Sanyan integration tests
      run: python tests/run_all.py
    - name: Measure code coverage
      run: |
        coverage run -m pytest tests/test_core.py tests/test_ops.py tests/test_lsp.py tests/test_package.py tests/test_iot.py tests/test_sugar_san.py tests/test_parser.py
        coverage report --fail-under=80
