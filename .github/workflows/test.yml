name: Test

on:
  push:
    branches: [main, master]
  pull_request:
    branches: [main, master]

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: "true"

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python -m pip install --upgrade pip
      - run: pip install .[dev]
      - run: ruff format --check .
      - run: ruff check .
      - run: mypy .

  test:
    strategy:
      matrix:
        os: [ubuntu-latest, macos-latest]
        python-version: ["3.12", "3.13"]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - run: python -m pip install --upgrade pip
      - run: pip install .[dev]
      - name: Cache build artifacts
        uses: actions/cache@v4
        with:
          path: build/
          key: build-${{ matrix.python-version }}-${{ hashFiles('stdlib/*.san') }}
      - run: python -X utf8 tests/test_core.py -v
      - run: python -X utf8 tests/test_commands.py -v
      - run: python -X utf8 tests/test_parser.py
      - run: python -X utf8 tests/test_ops.py -v
      - run: python -X utf8 tests/test_ops_ext.py -v
      - run: python -X utf8 tests/test_lsp.py -v
      - run: python -X utf8 tests/test_package.py -v
      - run: python -X utf8 tests/test_iot.py -v
      - run: python -X utf8 tests/test_sugar_san.py -v
      - run: python -X utf8 tests/test_llvmgen.py -v
      - run: python -X utf8 tests/test_dp_python.py -v
      - run: python -X utf8 tests/test_self_host.py -v
      - run: python -X utf8 tests/test_vm.py -v
      - run: python -X utf8 tests/run_all.py
      - run: python -X utf8 doc_sync.py

  c-vm-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python -m pip install --upgrade pip
      - run: pip install .[dev]
      - run: sudo apt-get install -y gcc
      - run: python -X utf8 tests/test_c_vm.py -v

  coverage:
    runs-on: ubuntu-latest
    needs: [test]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python -m pip install --upgrade pip
      - run: pip install .[dev]
      - name: Run tests with coverage
        run: python -m pytest tests/test_core.py tests/test_commands.py tests/test_parser.py tests/test_ops.py tests/test_ops_ext.py tests/test_lsp.py tests/test_package.py tests/test_iot.py tests/test_dp_python.py tests/test_self_host.py tests/test_sugar_self_host.py tests/test_vm.py tests/test_llvmgen.py tests/test_sugar_san.py --cov=. --cov-report=term-missing --cov-report=xml -q
      - name: Upload coverage to Codecov
        uses: codecov/codecov-action@v4
        if: always()
        with:
          file: coverage.xml
          fail_ci_if_error: false

  benchmark:
    runs-on: ubuntu-latest
    needs: [test]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python -m pip install --upgrade pip
      - run: pip install .[dev]
      - name: Run benchmark
        run: python benchmark/run_benchmark.py --quick
