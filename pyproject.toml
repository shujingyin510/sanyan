[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "sanyan"
dynamic = ["version"]
description = "A Chinese programming language based on balanced ternary logic"
readme = "README.md"
requires-python = ">=3.12"
license = {text = "GPL-3.0-only"}
authors = [
    {name = "Sanyan Developers"}
]
dependencies = []

[tool.setuptools.dynamic]
version = {attr = "sanyan.__version__"}

[project.optional-dependencies]
# ── 核心语言层 ──
core = []  # 纯 Python，无外部依赖

# ── 扩展功能层 ──
sugar = []  # 糖语法解析器，仅依赖 values.SrcNode（内含于 core）
vm = []     # 字节码 VM，零依赖（内含于 core）
llvmgen = ["llvmlite>=0.40.0"]  # LLVM 代码生成器

# ── IDE 支持层 ──
lsp = []  # LSP/DAP 协议层独立，分析层延迟加载 sugar/core

# ── 独立工具 ──
tools = []  # 格式化器/交叉编译器/doc_sync，全部零依赖

# ── 完整版（默认安装所有功能）──
all = [
    "sanyan[llvmgen]",
]

# ── 开发工具 ──
dev = [
    "sanyan[all]",
    "pytest>=7.0",
    "pytest-cov>=4.0",
    "coverage>=6.0",
    "ruff>=0.1.0",
    "mypy>=1.0",
    "pdoc3>=0.11.0",
]

[project.scripts]
sanyan = "sanyan.cli:main"

[tool.setuptools]
packages = ["sanyan", "ops", "sugar", "lsp", "llvmgen", "utils"]
py-modules = [
    "ternary_core", "evaluator", "values", "runtime", "eval_utils",
    "commands", "param_matcher", "tail_call", "lexer", "parser", "preprocess",
    "skin", "sandbox", "compile_bytecode", "compile_llvmgen", "vm",
     "type_checker", "repl", "main", "lsp_server", "dap_server",
    "sanfmt", "sanyancc", "doc_sync",
]

[tool.ruff]
line-length = 120
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "W"]
ignore = ["E501", "E701", "E702", "E703"]

[tool.ruff.lint.per-file-ignores]
# Demo 脚本：os.chdir() 后 import ops 模块是设计需要
"run_agent.py" = ["E402"]
"run_v2.py" = ["E402", "E401", "E722"]
"run_v2_demo.py" = ["E402", "E401", "E722"]
"run_village_demo.py" = ["E402", "E401", "E722"]

[tool.ruff.format]
quote-style = "single"

[tool.mypy]
python_version = "3.12"
ignore_missing_imports = true
strict = false
warn_unused_ignores = false
exclude = [
    "publish/",
    "tests/",
    "examples/",
    ".github/",
    "build/",
    "run_v2_demo.py",
]
[[tool.mypy.overrides]]
module = [
    "sugar.*",
    "lsp.*",
    "llvmgen.*",
    "agent_system.*",
]
ignore_errors = true

# 渐进式 strict：逐步启用核心模块的类型检查
[[tool.mypy.overrides]]
module = [
    "evaluator",
    "values",
    "runtime",
    "eval_utils",
    "ternary_core",
    "preprocess",
]
warn_return_any = true
warn_unused_ignores = false
disallow_untyped_defs = true

[tool.coverage.run]
source = ["."]
omit = [
    "tests/*",
    "examples/*",
    ".github/*",
    "docs/*",
    "build/*",
    "lsp/*",
    "lsp_server.py",
    "main.py",
    "repl.py",
    "sanfmt.py",
    "sanyancc.py",
    "gui.py",
    "dap_server.py",
    "setup.py",
    "sanyan/*",
    "agent_system/*",
    "preflight.py",
    "auto_verify.py",
    "asm.py",
    "disasm.py",
    "verify.py",
    "benchmark/*",
    "packages/*",
]

[tool.coverage.report]
exclude_lines = ["pragma: no cover", "if __name__ == .__main__.:", "raise NotImplementedError"]
show_missing = true
skip_covered = true
fail_under = 75
