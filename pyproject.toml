[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "sanyan"
version = "3.11.0"
description = "A Chinese programming language based on balanced ternary logic"
readme = "README.md"
requires-python = ">=3.8"
license = {text = "MIT"}
authors = [
    {name = "Sanyan Developers"}
]
dependencies = []

[project.optional-dependencies]
dev = [
    "pytest>=7.0",
    "coverage>=6.0",
    "ruff>=0.1.0",
]

[project.scripts]
sanyan = "main:main"

[tool.setuptools]
packages = ["ops", "sugar"]
py-modules = [
    "commands",
    "evaluator",
    "lexer",
    "main",
    "parser",
    "preprocess",
    "repl",
    "runtime",
    "skin",
    "ternary_core",
    "values"
]

[tool.ruff]
line-length = 120
target-version = "py38"

[tool.ruff.lint]
select = ["E", "F", "W"]
ignore = ["E501", "E701", "E702", "E703"]

[tool.ruff.format]
quote-style = "single"

[tool.coverage.run]
source = ["."]
omit = ["tests/*", "examples/*", ".github/*"]
command_line = "-m pytest"

[tool.coverage.report]
exclude_lines = ["pragma: no cover", "if __name__ == .__main__.:"]
show_missing = true
