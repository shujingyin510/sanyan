[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "sanyan"
version = "3.17.0"
description = "A Chinese programming language based on balanced ternary logic"
readme = "README.md"
requires-python = ">=3.12"
license = {text = "GPL-3.0-only"}
authors = [
    {name = "Sanyan Developers"}
]
dependencies = []

[project.optional-dependencies]
# ── 核心语言层 ──
core = []  # 纯 Python，无外部依赖

# ── 扩展功能层 ──
sugar = []  # 糖语法解析器，仅依赖 values.SrcNode（内含于 core）
vm = []     # 字节码 VM，零依赖（内含于 core）
llvmgen = ["llvmlite>=0.40.0"]  # LLVM 代码生成器

# ── IDE 支持层 ──
lsp = []  # LSP/DAP 协议层独立，分析层延迟加载 sugar/core

# ── 独立工具 ──
tools = []  # 格式化器/交叉编译器/doc_sync，全部零依赖

# ── 完整版（默认安装所有功能）──
all = [
    "sanyan[llvmgen]",
]

# ── 开发工具 ──
dev = [
    "sanyan[all]",
    "pytest>=7.0",
    "coverage>=6.0",
    "ruff>=0.1.0",
    "mypy>=1.0",
]

[project.scripts]
sanyan = "main:main"

[tool.setuptools]
packages = ["sanyan", "ops", "sugar", "lsp", "llvmgen"]
py-modules = []  # 由 setup.py 动态发现

[tool.ruff]
line-length = 120
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "W"]
ignore = ["E501", "E701", "E702", "E703"]

[tool.ruff.format]
quote-style = "single"

[tool.mypy]
python_version = "3.12"
ignore_missing_imports = true
strict = false
check_untyped_defs = true
warn_return_any = true
warn_unused_ignores = true
exclude = [
    "tests/",
    "examples/",
    ".github/",
    "build/",
]
[[tool.mypy.overrides]]
module = [
    "sugar.*",
    "lsp.*",
    "llvmgen.*",
]
ignore_errors = true

[tool.coverage.run]
source = ["."]
omit = ["tests/*", "examples/*", ".github/*"]
command_line = "-m pytest"

[tool.coverage.report]
exclude_lines = ["pragma: no cover", "if __name__ == .__main__.:"]
show_missing = true
